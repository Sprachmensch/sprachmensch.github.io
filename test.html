<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Clock Datum</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #333333;
            --text-color: #e0e0e0;
            --border-radius: 8px;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }

        .flip-container {
            display: flex;
            gap: 20px;
        }

        .flip-card {
            position: relative;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 8rem;
            font-weight: bold;
            width: 200px;
            height: 250px;
            line-height: 250px;
            text-align: center;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        /* Mittellinie der Klappanzeige */
        .flip-card::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(0,0,0,0.6);
            z-index: 2;
        }

        .label {
            position: absolute;
            bottom: -40px;
            left: 0;
            width: 100%;
            font-size: 1.2rem;
            text-transform: uppercase;
            color: #666;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="flip-container">
        <div class="flip-card">
            <span id="day">00</span>
            <div class="label">Tag</div>
        </div>

        <div class="flip-card">
            <span id="month">00</span>
            <div class="label">Monat</div>
        </div>
    </div>

    <script>
        function updateDate() {
            const now = new Date();
            
            // Tag (DD)
            const day = String(now.getDate()).padStart(2, '0');
            // Monat (MM)
            const month = String(now.getMonth() + 1).padStart(2, '0');

            document.getElementById('day').textContent = day;
            document.getElementById('month').textContent = month;
        }

        // Initial aufrufen und jede Stunde prüfen
        updateDate();
        setInterval(updateDate, 3600000);
    </script>
</body>
</html>
